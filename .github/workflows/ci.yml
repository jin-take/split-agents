name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: gofmt -w cmd internal
      - run: git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/chatgpt
