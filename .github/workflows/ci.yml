name: Internal CI

on:
  push:
    branches:
      - main
    paths:
      - 'internal/**'

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

jobs:
  test:
    name: Go Test / Vet / Build
    if: >
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/chatgpt
